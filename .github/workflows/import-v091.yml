name: Import verified JCF Network Manager v0.9.1 source
on:
  push:
    branches: [main]
    paths:
      - '.release-source/v0.9.1.tar.xz.b64'
      - '.github/workflows/import-v091.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jcf-v091-source-import
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.repository == 'nigelebrown/ArubaNetworkManager2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify transferred source archive
        run: |
          set -euo pipefail
          base64 --decode .release-source/v0.9.1.tar.xz.b64 > "$RUNNER_TEMP/v091.tar.xz"
          echo "e7e4fcf6275e6556ae58ff737511f45630d186833cd2977add2498495d314a50  $RUNNER_TEMP/v091.tar.xz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          path=__import__('os').environ['RUNNER_TEMP']+'/v091.tar.xz'
          with tarfile.open(path,'r:xz') as t:
              members=t.getmembers()
              assert 110 <= len(members) <= 130, 'Wrong archive file count'
              for m in members:
                  p=PurePosixPath(m.name)
                  if m.name.startswith('/') or '..' in p.parts or not m.isfile():
                      raise ValueError('Unsafe archive member: '+m.name)
                  if m.size>200000: raise ValueError('Oversized source member')
          print('Approved source files:',len(members))
          PY
          mkdir -p "$RUNNER_TEMP/jcf-v091"
          tar -xJf "$RUNNER_TEMP/v091.tar.xz" -C "$RUNNER_TEMP/jcf-v091" --no-same-owner
          test "$(grep -c '<Version>0.9.1</Version>' "$RUNNER_TEMP/jcf-v091/src/Jcf.NetworkManager/Jcf.NetworkManager.csproj")" = 1
          test -f "$RUNNER_TEMP/jcf-v091/deploy/native/PREPARE_NATIVE.sh"
          test -f "$RUNNER_TEMP/jcf-v091/src/Jcf.NetworkManager/Migrations/20261106123050_DeviceIntegration.cs"
          test -f "$RUNNER_TEMP/jcf-v091/src/Jcf.NetworkManager/Services/LocalIdentityBootstrap.cs"
          rsync -a "$RUNNER_TEMP/jcf-v091/" ./
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate source without contacting JCF network
        run: |
          set -euo pipefail
          bash -n deploy/native/PREPARE_NATIVE.sh deploy/native/ACTIVATE_NATIVE.sh
          python3 deploy/native/TEST_NATIVE_SAFETY.py
          python3 scripts/TEST_REAL_PILOT_CLIENT_OFFLINE.py
          dotnet restore Jcf.NetworkManager.slnx
          dotnet build Jcf.NetworkManager.slnx -c Release --no-restore
          dotnet test tests/Jcf.NetworkManager.Tests.csproj -c Release --no-build --no-restore
      - name: Commit verified complete source to main
        run: |
          set -euo pipefail
          git config user.name 'jcf-source-import[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .config .gitignore .dockerignore README.md README_NATIVE_PRODUCTION.md CHANGELOG.md \
            Jcf.NetworkManager.slnx src tests scripts deploy/native docs
          if git diff --cached --quiet; then
            echo 'Source already present on main.'
            exit 0
          fi
          git commit -m 'Release JCF Network Manager v0.9.1: native SQL Identity + simulated devices'
          git push origin HEAD:main
